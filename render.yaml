services:
  - type: web
    name: hawk-taekwondo
    env: node
    plan: free
    buildCommand: npm ci --omit=dev && cd frontend && npm ci --omit=dev && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false  # Set in Render dashboard
      - key: ADMIN_PASSWORD_HASH
        sync: false  # Set in Render dashboard
      - key: FRONTEND_URL
        value: https://hawktaekwondo.onrender.com
      - key: PORT
        value: 10000
      - key: CLOUDINARY_CLOUD_NAME
        sync: false  # Set in Render dashboard
      - key: CLOUDINARY_API_KEY
        sync: false  # Set in Render dashboard
      - key: CLOUDINARY_API_SECRET
        sync: false  # Set in Render dashboard