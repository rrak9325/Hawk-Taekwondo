services:
  # Single service - Backend serves frontend
  - type: web
    name: hawk-taekwondo
    env: node
    plan: free
    buildCommand: |
      echo "=== Building Frontend ===" &&
      cd frontend &&
      npm ci --prefer-offline --no-audit &&
      npm run build &&
      echo "=== Frontend build complete ===" &&
      ls -la dist &&
      cd ../backend &&
      echo "=== Installing Backend Dependencies ===" &&
      npm ci --prefer-offline --no-audit &&
      echo "=== Build complete ==="
    startCommand: cd backend && NODE_ENV=production node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: FRONTEND_URL
        value: https://hawktaekwondo.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false